<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
<title id="title">PrintProfit</title>
<desc id="desc">PrintProfit logo with silver lettering and orange balance scale, for 3D printing cost and pricing.</desc>
<defs>
  <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffab57"/>
