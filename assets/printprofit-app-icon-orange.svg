<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">PrintProfit app icon</title>
<desc id="desc">Dark PrintProfit app tile with a white balance mark and orange accents.</desc>
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#20323d"/>
    <stop offset=".52" stop-color="#111e27"/>
    <stop offset="1" stop-color="#080e13"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffad59"/>
    <stop offset=".55" stop-color="#ff8720"/>
    <stop offset="1" stop-color="#e95d00"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".36"/>
  </filter>
</defs>
