<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintProfit — 3D Printing Cost & Pricing Calculator</title>
<style>
html,body{margin:0;padding:0;background:#071018;color:#f5f8fb;overflow-anchor:none;scroll-behavior:auto!important}#app{display:block;width:100%;min-height:100vh;border:0}body{overflow:auto;overflow-anchor:none}
#ppFloatingReset{position:fixed;right:22px;bottom:22px;min-width:154px;height:50px;padding:0 18px;border-radius:14px;border:1px solid #ff7800;background:linear-gradient(145deg,#ff8f24,#ff7800);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font:900 13px/1 Inter,Segoe UI,system-ui,sans-serif;letter-spacing:.08em;cursor:pointer;z-index:9999;box-shadow:0 10px 28px #000b,0 0 24px #ff780033;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
#ppFloatingReset .pp-reset-icon{width:25px;height:25px;border:2px solid rgba(255,255,255,.9);border-radius:50%;display:grid;place-items:center;font-size:17px;line-height:1;letter-spacing:0}
#ppFloatingReset .pp-reset-text{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
#ppFloatingReset .pp-reset-main{font-size:13px;line-height:1}
#ppFloatingReset .pp-reset-sub{font-size:7px;line-height:1;letter-spacing:.16em;opacity:.78}
#ppFloatingReset:hover{transform:translateY(-3px);box-shadow:0 14px 32px #000b,0 0 32px #ff780066;filter:brightness(1.08)}
#ppFloatingReset:active{transform:scale(.96)}
#ppFloatingReset:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(max-width:650px){#ppFloatingReset{right:14px;bottom:14px;min-width:132px;height:44px;padding:0 13px;border-radius:12px;gap:8px}#ppFloatingReset .pp-reset-icon{width:22px;height:22px;font-size:15px}#ppFloatingReset .pp-reset-main{font-size:11px}#ppFloatingReset .pp-reset-sub{font-size:6px}}
</style>
</head>
<body>
<iframe id="app" title="PrintProfit 3D Printing Cost & Pricing Calculator" src="./legacy-index.html?v=20260918-logo20" style="width:100%;border:0;display:block"></iframe>
<button id="ppFloatingReset" type="button" aria-label="Reset calculator" title="Reset calculator"><span class="pp-reset-icon">↻</span><span class="pp-reset-text"><span class="pp-reset-main">RESET</span><span class="pp-reset-sub">CALCULATOR</span></span></button>
<script>
(()=>{
'use strict';
const frame=document.getElementById('app');
const resetButton=document.getElementById('ppFloatingReset');

let ppOuterLockUntil=0,ppOuterLockX=0,ppOuterLockY=0,ppOuterLockTimer=null,ppOuterScrollHandler=null;
window.__ppLockOuterScroll=function(duration=120){
  ppOuterLockX=window.scrollX; ppOuterLockY=window.scrollY; ppOuterLockUntil=performance.now()+duration;
  if(ppOuterScrollHandler)window.removeEventListener('scroll',ppOuterScrollHandler,true);
  ppOuterScrollHandler=()=>{if(performance.now()<=ppOuterLockUntil)window.scrollTo({left:ppOuterLockX,top:ppOuterLockY,behavior:'auto'});};
  window.addEventListener('scroll',ppOuterScrollHandler,true);
  if(ppOuterLockTimer)clearInterval(ppOuterLockTimer);
  ppOuterLockTimer=setInterval(()=>{
    window.scrollTo({left:ppOuterLockX,top:ppOuterLockY,behavior:'auto'});
    if(performance.now()>ppOuterLockUntil){
      clearInterval(ppOuterLockTimer);ppOuterLockTimer=null;
      window.removeEventListener('scroll',ppOuterScrollHandler,true);ppOuterScrollHandler=null;
    }
  },16);
  window.scrollTo({left:ppOuterLockX,top:ppOuterLockY,behavior:'auto'});
};

const scripts=[
'quick-price-guard.js?v=6',
'reset-fix.js?v=10','drag-gcode-fix.js?v=1','file-type-support.js?v=2','app-enhancements.js?v=5','ui-enhancements.js?v=1','pricing-ux.js?v=1','global-actions.js?v=1','pretty-ui.js?v=5','alignment-polish.js?v=2','hero-composition.js?v=3','header-hero-fix.js?v=3','final-theme.js?v=3','reference-theme.js?v=2','gcode-reader.js?v=2','chosen-theme.js?v=1','signature-theme.js?v=1','interaction-fix.js?v=2','containment-fix.js?v=1','mono-orange-cool-theme.js?v=1','box-icons.js?v=5','hero-feature-icons.js?v=1','electricity-providers.js?v=4','hero-ticker-position.js?v=2','hero-compact-fix.js?v=2','master-polish.js?v=1','master-cleanup.js?v=2','natural-flow.js?v=3','site-final-polish.js?v=4','top-scratch.js?v=2','flow-cards.js?v=1','clean-top.js?v=1','tab-layout.js?v=15'
];
function fit(){try{const d=frame.contentDocument;if(!d)return;const x=window.scrollX,y=window.scrollY;const h=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight,d.documentElement.offsetHeight,d.body.offsetHeight);if(h>0&&frame.style.height!==h+'px'){frame.style.height=h+'px';window.scrollTo({left:x,top:y,behavior:'auto'});requestAnimationFrame(()=>window.scrollTo({left:x,top:y,behavior:'auto'}));setTimeout(()=>window.scrollTo({left:x,top:y,behavior:'auto'}),0);setTimeout(()=>window.scrollTo({left:x,top:y,behavior:'auto'}),50);setTimeout(()=>window.scrollTo({left:x,top:y,behavior:'auto'}),150);}}catch(e){}}
function load(src){return new Promise(resolve=>{const d=frame.contentDocument;if(!d){resolve();return;}const s=d.createElement('script');s.src='./'+src;s.onload=resolve;s.onerror=()=>{console.warn('PrintProfit script failed:',src);resolve();};d.body.appendChild(s);});}
function doReset(){try{const d=frame.contentDocument;const reset=d?.getElementById('reset');if(reset){reset.click();return;}const fallback=d?.querySelector('.actions button[id*="reset" i]');if(fallback)fallback.click();}catch(e){console.warn('PrintProfit reset failed',e);}}
resetButton.addEventListener('click',doReset);
frame.addEventListener('load',async()=>{try{for(const src of scripts)await load(src);fit();setTimeout(fit,100);setTimeout(fit,500);setTimeout(fit,1500);if(window.ResizeObserver){const ro=new ResizeObserver(fit);ro.observe(frame.contentDocument.documentElement);ro.observe(frame.contentDocument.body);}setInterval(fit,1000);}catch(e){console.error('PrintProfit enhancement load failed',e);}});
})();
</script>
</body>
</html>
