<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintProfit — 3D Printing Cost & Pricing Calculator</title>
<link rel="icon" type="image/svg+xml" href="./assets/printprofit-favicon-orange.svg?v=1">
<link rel="apple-touch-icon" href="./assets/printprofit-app-icon-orange.svg?v=1">
<meta name="theme-color" content="#071018">
<style>
html,body{margin:0;padding:0;background:#071018;color:#f5f8fb}#app{display:block;width:100%;min-height:100vh;border:0}body{overflow:auto}
#ppFloatingReset{position:fixed;right:22px;bottom:22px;min-width:154px;height:50px;padding:0 18px;border-radius:14px;border:1px solid #009FEF;background:linear-gradient(145deg,#19D8FF,#009FEF);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font:900 13px/1 Inter,Segoe UI,system-ui,sans-serif;letter-spacing:.08em;cursor:pointer;z-index:9999;box-shadow:0 10px 28px #000b,0 0 24px #009FEF33;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
#ppFloatingReset .pp-reset-icon{width:25px;height:25px;border:2px solid rgba(255,255,255,.9);border-radius:50%;display:grid;place-items:center;font-size:17px;line-height:1;letter-spacing:0}
#ppFloatingReset .pp-reset-text{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
#ppFloatingReset .pp-reset-main{font-size:13px;line-height:1}
#ppFloatingReset .pp-reset-sub{font-size:7px;line-height:1;letter-spacing:.16em;opacity:.78}
#ppFloatingReset:hover{transform:translateY(-3px);box-shadow:0 14px 32px #000b,0 0 32px #009FEF66;filter:brightness(1.08)}
#ppFloatingReset:active{transform:scale(.96)}
#ppFloatingReset:focus-visible{outline:2px solid #fff;outline-offset:3px}
#ppFloatingSave{position:fixed;left:22px;bottom:22px;min-width:154px;height:50px;padding:0 18px;border-radius:14px;border:1px solid #10B981;background:linear-gradient(145deg,#34D399,#0D986B);color:#062016;display:flex;align-items:center;justify-content:center;gap:10px;font:900 13px/1 Inter,Segoe UI,system-ui,sans-serif;letter-spacing:.08em;cursor:pointer;z-index:9999;box-shadow:0 10px 28px #000b,0 0 24px #10B98133;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease};#ppFloatingSave.pp-save-updated{border-color:#fff;background:linear-gradient(145deg,#10B981,#1fae62);color:#052215;box-shadow:0 0 0 2px #10B98166,0 0 32px #10B98199,0 10px 28px #000b;transform:translateY(-3px) scale(1.03)!important;filter:brightness(1.08)}#ppFloatingSave .pp-save-icon{width:25px;height:25px;display:grid;place-items:center;font-size:17px;line-height:1}#ppFloatingSave .pp-save-text{display:flex;flex-direction:column;align-items:flex-start;gap:2px}#ppFloatingSave .pp-save-main{font-size:13px;line-height:1}#ppFloatingSave .pp-save-sub{font-size:7px;line-height:1;letter-spacing:.16em;opacity:.78}#ppFloatingSave:hover{transform:translateY(-3px);box-shadow:0 14px 32px #000b,0 0 32px #10B98166;filter:brightness(1.05)}#ppFloatingSave:active{transform:scale(.96)}#ppFloatingSave:focus-visible{outline:2px solid #fff;outline-offset:3px}@media(max-width:650px){#ppFloatingSave{left:14px;bottom:14px;min-width:132px;height:44px;padding:0 13px;border-radius:12px;gap:8px}#ppFloatingSave .pp-save-icon{font-size:15px}#ppFloatingSave .pp-save-main{font-size:11px}#ppFloatingSave .pp-save-sub{font-size:6px}#ppFloatingReset{right:14px;bottom:14px;min-width:132px;height:44px;padding:0 13px;border-radius:12px;gap:8px}#ppFloatingReset .pp-reset-icon{width:22px;height:22px;font-size:15px}#ppFloatingReset .pp-reset-main{font-size:11px}#ppFloatingReset .pp-reset-sub{font-size:6px}}

#ppFloatingSave .pp-save-icon svg,#ppFloatingReset .pp-reset-icon svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
#ppFloatingReset .pp-reset-icon{display:grid;place-items:center;color:#F5F7FA}
#ppFloatingSave .pp-save-icon,#ppFloatingReset .pp-reset-icon{width:32px!important;height:32px!important;border:0!important;border-radius:10px!important;font-size:0!important;background-image:url("./assets/printprofit-action-icons.webp?v=1")!important;background-size:600% 100%!important;background-repeat:no-repeat!important;box-shadow:0 0 0 1px #ffffff2a!important}
#ppFloatingSave .pp-save-icon{background-position:0% center!important}
#ppFloatingReset .pp-reset-icon{background-position:60% center!important}
#ppFloatingSave .pp-save-icon svg,#ppFloatingReset .pp-reset-icon svg{display:none!important}
body[data-pp-modal-open="true"] #ppFloatingSave,body[data-pp-modal-open="true"] #ppFloatingReset{display:none!important}

/* Keep the base calculator out of view until its finished design is ready. */
body:not([data-pp-ready="true"]){overflow:hidden}
body:not([data-pp-ready="true"]) #app{visibility:hidden;pointer-events:none}
body:not([data-pp-ready="true"]) #ppFloatingSave,body:not([data-pp-ready="true"]) #ppFloatingReset{display:none!important}
.pp-loading{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#071018;color:#c5d5de;font:15px/1.5 Segoe UI,system-ui,sans-serif;text-align:center;padding:24px}
.pp-loading img{width:240px;max-width:75vw;height:auto}
.pp-loading p{margin:0}
.pp-loading button{border:0;border-radius:10px;padding:12px 20px;background:#ff8a24;color:#17100a;font:700 14px Segoe UI,system-ui,sans-serif;cursor:pointer}
body[data-pp-ready="true"] .pp-loading{display:none}
</style>
</head>
<body aria-busy="true">
<div id="ppLoading" class="pp-loading" role="status" aria-live="polite">
<img src="./assets/printprofit-logo-orange.svg?v=5" alt="PrintProfit" width="240">
<p id="ppLoadingMessage">Loading your calculator…</p>
<button id="ppLoadingRetry" type="button" hidden>Try again</button>
</div>
<noscript><style>.pp-loading{display:none}</style><p>Please enable JavaScript to use the PrintProfit calculator.</p></noscript>
<iframe id="app" title="PrintProfit 3D Printing Cost & Pricing Calculator" src="./legacy-index.html?v=20261004-nightly1" style="width:100%;border:0;display:block"></iframe>
<button id="ppFloatingSave" type="button" aria-label="Save project" title="Save project"><span class="pp-save-icon"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="./assets/printprofit-icon-master.svg#pp-save"></use></svg></span><span class="pp-save-text"><span class="pp-save-main">SAVE</span><span class="pp-save-sub">PROJECT</span></span></button><button id="ppFloatingReset" type="button" aria-label="Reset calculator" title="Reset calculator"><span class="pp-reset-icon"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="./assets/printprofit-icon-master.svg#pp-undo"></use></svg></span><span class="pp-reset-text"><span class="pp-reset-main">RESET</span><span class="pp-reset-sub">CALCULATOR</span></span></button>
<script>
(()=>{
'use strict';
const frame=document.getElementById('app');
const resetButton=document.getElementById('ppFloatingReset');
const loadingMessage=document.getElementById('ppLoadingMessage');
const retryButton=document.getElementById('ppLoadingRetry');
retryButton.addEventListener('click',()=>location.reload());
let loadGeneration=0;
function beginLoading(){
 document.body.removeAttribute('data-pp-ready');
 document.body.setAttribute('aria-busy','true');
 loadingMessage.textContent='Loading your calculator…';
 retryButton.hidden=true;
}
function showLoadError(){
 document.body.removeAttribute('data-pp-ready');
 document.body.setAttribute('aria-busy','false');
 loadingMessage.textContent='The calculator could not finish loading. Please try again.';
 retryButton.hidden=false;
}
function revealCalculator(){
 document.body.dataset.ppReady='true';
 document.body.setAttribute('aria-busy','false');
}
const scripts=[
'hero-photo-data.js?v=1',
'quick-price-guard.js?v=9',
'reset-fix.js?v=20261004-file-info1',
'stl-file-preview.js?v=20261004-file-info1',
'slicer-file-parser.js?v=20261004-file-info1',
'file-type-support.js?v=20261004-autofill1',
'tab-layout.js?v=20261004-autofill1',
'ui-modals.js?v=20261004-theme2',
'ui-enhancements.js?v=4',
'gcode-reader.js?v=20261004-file-info1',
'print-time-input.js?v=20261004-autofill1',
'electricity-providers.js?v=20261004-nightly1',
'i18n-extra.js?v=5',
'settings-preferences.js?v=20261004-theme1',
'my-projects.js?v=20261004-file-info1',
'my-materials.js?v=7',
'quantity-auto-batch.js?v=2',
'printer-material-polish.js?v=4',
'material-brands.js?v=1',
'profit-advisor.js?v=29',
'profit-tools.js?v=4',
'data/price-finder.js?v=20261004-nightly1',
'printer-price-data.js?v=20261004-nightly1',
'printer-price-sync.js?v=1',
'market-price-sync.js?v=1',
'calculator-state.js?v=20261004-file-info1',
'calculator-visual.js?v=8',
'visual-master.js?v=20261004-theme1',
'printprofit-missed-icons.js?v=6',
'printprofit-icon-art.js?v=4',
'hero-slogan-layout.js?v=1'
 ];
// Download in parallel while preserving the original execution order below.
for(const src of scripts){
 const hint=document.createElement('link');
 hint.rel='preload';hint.as='script';hint.href='./'+src;
 document.head.appendChild(hint);
}
function fit(){try{const d=frame.contentDocument;if(!d)return;const h=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight,d.documentElement.offsetHeight,d.body.offsetHeight);if(h>0)frame.style.height=h+'px';}catch(e){}}
function load(src){return new Promise(resolve=>{const d=frame.contentDocument;if(!d){resolve();return;}const s=d.createElement('script');s.src='./'+src;s.onload=resolve;s.onerror=()=>{console.warn('PrintProfit script failed:',src);resolve();};d.body.appendChild(s);});}
function doReset(){
 try{
  const d=frame.contentDocument;
  const reset=d?.getElementById('reset');
  if(reset){reset.click();return;}
  const fallback=d?.querySelector('.actions button[id*="reset" i]');
  if(fallback)fallback.click();
 }catch(e){console.warn('PrintProfit reset failed',e);}
}
function wireTopModals(){
 try{
  const d=frame.contentDocument;
  if(!d)return;
  const guide=d.querySelector('#ppCleanTop [data-target="guide"]');
  if(guide&&guide.dataset.ppParentBound!=='1'){
    guide.dataset.ppParentBound='1';
    guide.addEventListener('click',e=>{
      e.preventDefault();
      e.stopImmediatePropagation();
      frame.contentWindow.__openPrintProfitGuide?.();
    },true);
  }
 }catch(e){console.warn('PrintProfit navigation wiring failed',e);}
}
resetButton.addEventListener('click',doReset);
const saveButton=document.getElementById('ppFloatingSave');
saveButton.addEventListener('click',()=>{try{const d=frame.contentDocument;if(d)d.getElementById('saveProject')?.click();}catch(e){console.warn('PrintProfit save failed',e);}});
frame.addEventListener('load',async()=>{
 const generation=++loadGeneration;
 beginLoading();
 const stalled=setTimeout(()=>{if(generation===loadGeneration)showLoadError();},45000);
 try{
  const d=frame.contentDocument;
  // Reloads inside the calculator must also hide its initial base layout.
  frame.contentWindow.addEventListener('pagehide',()=>{++loadGeneration;beginLoading();},{once:true});
  for(const src of scripts){
   await load(src);
   if(generation!==loadGeneration)return;
  }
  const design=d.getElementById('ppVisualMaster');
  if(!design||!d.getElementById('ppVisualMasterStyles'))throw new Error('Finished design is unavailable');
  // Allow the logo, banner and font metrics to settle before the first reveal.
  const images=[...design.querySelectorAll('img')].map(img=>img.decode?.().catch(()=>{}));
  await Promise.race([
   Promise.all([...images,d.fonts?.ready]),
   new Promise(resolve=>setTimeout(resolve,2500))
  ]);
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  if(generation!==loadGeneration)return;
  // Size the iframe only during initial settling. Do not continuously observe
  // the child document: the calculator changes its own layout during startup,
  // and a parent resize observer can create a parent/child resize feedback loop.
  const settle=()=>{fit();wireTopModals();};
  settle();
  revealCalculator();
  setTimeout(settle,100);
  setTimeout(settle,500);
  setTimeout(settle,1500);
  setTimeout(settle,3000);
 }catch(e){
  console.error('PrintProfit enhancement load failed',e);
  if(generation===loadGeneration)showLoadError();
 }finally{clearTimeout(stalled);}
});
})();
</script>
</body>
</html>
