<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintProfit — Loading…</title>
<style>html,body{margin:0;min-height:100%;background:#071018;color:#f5f8fb;font:15px Inter,Segoe UI,system-ui,sans-serif}body{display:grid;place-items:center;min-height:100vh}.loader{text-align:center;color:#aebdca}.loader b{display:block;color:#0798ff;font-size:24px;margin-bottom:8px}.loader span{font-size:12px}</style>
<script src="./quick-price-guard.js?v=5"></script>
</head>
<body><div class="loader"><b>PrintProfit</b><span>Loading calculator…</span></div>
<script>
(()=>{
  'use strict';
  function copyNode(node,parent){if(node.nodeType!==1&&node.nodeType!==3&&node.nodeType!==8)return;parent.appendChild(document.importNode(node,true));}
  function runScript(node,parent){const script=document.createElement('script');for(const attr of node.attributes)script.setAttribute(attr.name,attr.value);script.textContent=node.textContent||'';parent.appendChild(script);}
  async function loadLegacyPage(){
    const response=await fetch('./legacy-index.html?build=20260917-final5',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load calculator page ('+response.status+').');
    const html=await response.text();
    const parsed=new DOMParser().parseFromString(html,'text/html');
    document.documentElement.lang=parsed.documentElement.lang||'en';
    document.head.innerHTML='';
    for(const node of parsed.head.childNodes){if(node.nodeType===1&&node.tagName.toLowerCase()==='script')runScript(node,document.head);else copyNode(node,document.head);}
    document.body.innerHTML='';
    const bodyScripts=[];
    for(const node of parsed.body.childNodes){
      if(node.nodeType===1&&node.tagName.toLowerCase()==='script'){
        const src=node.getAttribute('src')||'';
        if(/tab-layout\\.js/i.test(src))continue;
        bodyScripts.push(node);
      }else copyNode(node,document.body);
    }
    for(const node of bodyScripts)runScript(node,document.body);
    if(!window.__printProfitReady)document.dispatchEvent(new Event('DOMContentLoaded',{bubbles:true}));
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    document.title=parsed.title||document.title;
  }
  function loadScript(src,message){return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=()=>reject(new Error(message));document.body.appendChild(script);});}
  function loadResetFix(){return loadScript('./reset-fix.js?v=8','Could not load PrintProfit reset fixes.');}
  function loadDragGcodeFix(){return loadScript('./drag-gcode-fix.js?v=1','Could not load PrintProfit G-code drag-and-drop fix.');}
  function loadFileTypeSupport(){return loadScript('./file-type-support.js?v=2','Could not load PrintProfit universal file support.');}
  function loadEnhancements(){return loadScript('./app-enhancements.js?v=5','Could not load PrintProfit interface enhancements.');}
  function loadTabLayout(){return loadScript('./tab-layout.js?v=7','Could not load PrintProfit tabbed workspace.');}
  function loadUIEnhancements(){return loadScript('./ui-enhancements.js?v=1','Could not load PrintProfit UI enhancements.');}
  function loadPricingUX(){return loadScript('./pricing-ux.js?v=1','Could not load PrintProfit pricing UX.');}
  function loadGlobalActions(){return loadScript('./global-actions.js?v=1','Could not load PrintProfit global actions.');}
  function loadPrettyUI(){return loadScript('./pretty-ui.js?v=5','Could not load PrintProfit visual theme.');}
  function loadAlignmentPolish(){return loadScript('./alignment-polish.js?v=2','Could not load PrintProfit alignment polish.');}
  function loadHeroComposition(){return loadScript('./hero-composition.js?v=3','Could not load PrintProfit hero composition.');}
  function loadHeaderHeroFix(){return loadScript('./header-hero-fix.js?v=3','Could not load PrintProfit header and hero layout.');}
  function loadFinalTheme(){return loadScript('./final-theme.js?v=3','Could not load PrintProfit master theme.');}
  function loadReferenceTheme(){return loadScript('./reference-theme.js?v=1','Could not load PrintProfit reference header and hero.');}
  function loadGcodeReader(){return loadScript('./gcode-reader.js?v=1','Could not load PrintProfit reliable G-code reader.');}
  loadLegacyPage().then(loadResetFix).then(loadDragGcodeFix).then(loadFileTypeSupport).then(loadEnhancements).then(loadTabLayout).then(loadUIEnhancements).then(loadPricingUX).then(loadGlobalActions).then(loadPrettyUI).then(loadAlignmentPolish).then(loadHeroComposition).then(loadHeaderHeroFix).then(loadFinalTheme).then(loadReferenceTheme).then(loadGcodeReader).catch(error=>{console.error(error);document.body.innerHTML='<div class="loader"><b>PrintProfit</b><span>'+error.message+'</span></div>';});
})();
</script>
</body></html>
