<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintProfit — 3D Printing Cost & Pricing Calculator</title>
<style>
html,body{margin:0;padding:0;background:#071018;color:#f5f8fb}#app{display:block;width:100%;min-height:100vh;border:0}body{overflow:auto}
#ppFloatingReset{position:fixed;right:22px;bottom:22px;width:48px;height:48px;border-radius:50%;border:1px solid #ff7800;background:linear-gradient(145deg,#ff8a1a,#ff7800);color:#fff;display:grid;place-items:center;font:900 22px/1 Inter,Segoe UI,system-ui,sans-serif;cursor:pointer;z-index:9999;box-shadow:0 8px 24px #0009,0 0 20px #ff780033;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
#ppFloatingReset:hover{transform:translateY(-3px) rotate(-18deg);box-shadow:0 12px 28px #000b,0 0 28px #ff780055;filter:brightness(1.08)}
#ppFloatingReset:active{transform:scale(.94) rotate(-18deg)}
#ppFloatingReset:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(max-width:650px){#ppFloatingReset{right:14px;bottom:14px;width:44px;height:44px;font-size:20px}}
</style>
</head>
<body>
<iframe id="app" title="PrintProfit 3D Printing Cost & Pricing Calculator" src="./legacy-index.html?v=20260917-fullstack8" style="width:100%;border:0;display:block"></iframe>
<button id="ppFloatingReset" type="button" aria-label="Reset calculator" title="Reset calculator">↻</button>
<script>
(()=>{
'use strict';
const frame=document.getElementById('app');
const resetButton=document.getElementById('ppFloatingReset');
const scripts=[
'quick-price-guard.js?v=6',
'reset-fix.js?v=10','drag-gcode-fix.js?v=1','file-type-support.js?v=2','app-enhancements.js?v=5','ui-enhancements.js?v=1','pricing-ux.js?v=1','global-actions.js?v=1','pretty-ui.js?v=5','alignment-polish.js?v=2','hero-composition.js?v=3','header-hero-fix.js?v=3','final-theme.js?v=3','reference-theme.js?v=2','gcode-reader.js?v=2','chosen-theme.js?v=1','signature-theme.js?v=1','interaction-fix.js?v=2','containment-fix.js?v=1','mono-orange-cool-theme.js?v=1','box-icons.js?v=5','hero-feature-icons.js?v=1','electricity-providers.js?v=4','hero-ticker-position.js?v=2','hero-compact-fix.js?v=2','tab-layout.js?v=11','master-polish.js?v=1','master-cleanup.js?v=2','natural-flow.js?v=3','site-final-polish.js?v=4','top-scratch.js?v=2','flow-cards.js?v=1'
];
function fit(){try{const d=frame.contentDocument;if(!d)return;const h=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight,d.documentElement.offsetHeight,d.body.offsetHeight);if(h>0)frame.style.height=h+'px';}catch(e){}}
function load(src){return new Promise(resolve=>{const d=frame.contentDocument;if(!d){resolve();return;}const s=d.createElement('script');s.src='./'+src;s.onload=resolve;s.onerror=()=>{console.warn('PrintProfit script failed:',src);resolve();};d.body.appendChild(s);});}
function doReset(){
 try{
  const d=frame.contentDocument;
  const reset=d?.getElementById('reset');
  if(reset){reset.click();return;}
  const fallback=d?.querySelector('.actions button[id*="reset" i]');
  if(fallback)fallback.click();
 }catch(e){console.warn('PrintProfit reset failed',e);}
}
resetButton.addEventListener('click',doReset);
frame.addEventListener('load',async()=>{
 try{
  for(const src of scripts)await load(src);
  fit();
  setTimeout(fit,100);setTimeout(fit,500);setTimeout(fit,1500);
  if(window.ResizeObserver){const ro=new ResizeObserver(fit);ro.observe(frame.contentDocument.documentElement);ro.observe(frame.contentDocument.body);}
  setInterval(fit,1000);
 }catch(e){console.error('PrintProfit enhancement load failed',e);}
});
})();
</script>
</body>
</html>
