<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintProfit — 3D Printing Cost & Pricing Calculator</title>
<style>
html,body{margin:0;padding:0;background:#071018;color:#f5f8fb}#app{display:block;width:100%;min-height:100vh;border:0}body{overflow:auto}
</style>
</head>
<body>
<iframe id="app" title="PrintProfit 3D Printing Cost & Pricing Calculator" src="./legacy-index.html?v=20260917-fullstack3" style="width:100%;border:0;display:block"></iframe>
<script>
(()=>{
'use strict';
const frame=document.getElementById('app');
const scripts=[
'quick-price-guard.js?v=6',
'reset-fix.js?v=10','drag-gcode-fix.js?v=1','file-type-support.js?v=2','app-enhancements.js?v=5','ui-enhancements.js?v=1','pricing-ux.js?v=1','global-actions.js?v=1','pretty-ui.js?v=5','alignment-polish.js?v=2','hero-composition.js?v=3','header-hero-fix.js?v=3','final-theme.js?v=3','reference-theme.js?v=2','gcode-reader.js?v=2','chosen-theme.js?v=1','signature-theme.js?v=1','interaction-fix.js?v=2','containment-fix.js?v=1','mono-orange-cool-theme.js?v=1','box-icons.js?v=4','hero-feature-icons.js?v=1','electricity-providers.js?v=4','hero-ticker-position.js?v=2','hero-compact-fix.js?v=2','global-reset.js?v=2','tab-layout.js?v=9','master-polish.js?v=1','master-cleanup.js?v=2','natural-flow.js?v=3','site-final-polish.js?v=4'
];
function fit(){try{const d=frame.contentDocument;if(!d)return;const h=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight,d.documentElement.offsetHeight,d.body.offsetHeight);if(h>0)frame.style.height=h+'px';}catch(e){}}
function load(src){return new Promise(resolve=>{const d=frame.contentDocument;if(!d){resolve();return;}const s=d.createElement('script');s.src='./'+src;s.onload=resolve;s.onerror=()=>{console.warn('PrintProfit script failed:',src);resolve();};d.body.appendChild(s);});}
frame.addEventListener('load',async()=>{
 try{
  for(const src of scripts)await load(src);
  fit();
  setTimeout(fit,100);setTimeout(fit,500);setTimeout(fit,1500);
  if(window.ResizeObserver){const ro=new ResizeObserver(fit);ro.observe(frame.contentDocument.documentElement);ro.observe(frame.contentDocument.body);}
  setInterval(fit,1000);
 }catch(e){console.error('PrintProfit enhancement load failed',e);}
});
})();
</script>
</body>
</html>
