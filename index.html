<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintProfit — Loading…</title>
<style>html,body{margin:0;min-height:100%;background:#071018;color:#f5f8fb;font:15px Inter,Segoe UI,system-ui,sans-serif}body{display:grid;place-items:center;min-height:100vh}.loader{text-align:center;color:#aebdca}.loader b{display:block;color:#ff7800;font-size:24px;margin-bottom:8px}.loader span{font-size:12px}</style>
<script src="./quick-price-guard.js?v=3"></script>
</head>
<body><div class="loader"><b>PrintProfit</b><span>Loading calculator…</span></div>
<script>
(()=>{
  'use strict';
  function copyNode(node,parent){if(node.nodeType!==1&&node.nodeType!==3&&node.nodeType!==8)return;parent.appendChild(document.importNode(node,true));}
  function runScript(node,parent){const script=document.createElement('script');for(const attr of node.attributes)script.setAttribute(attr.name,attr.value);script.textContent=node.textContent||'';parent.appendChild(script);}
  async function loadLegacyPage(){
    const response=await fetch('./legacy-index.html?build=20260917-final',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load calculator page ('+response.status+').');
    const html=await response.text();
    const parsed=new DOMParser().parseFromString(html,'text/html');
    document.documentElement.lang=parsed.documentElement.lang||'en';
    document.head.innerHTML='';
    for(const node of parsed.head.childNodes){
      if(node.nodeType===1&&node.tagName.toLowerCase()==='script')runScript(node,document.head);else copyNode(node,document.head);
    }
    document.body.innerHTML='';
    const bodyScripts=[];
    for(const node of parsed.body.childNodes){
      if(node.nodeType===1&&node.tagName.toLowerCase()==='script'){
        const src=node.getAttribute('src')||'';
        if(/tab-layout\.js/i.test(src))continue;
        bodyScripts.push(node);
      }else copyNode(node,document.body);
    }
    for(const node of bodyScripts)runScript(node,document.body);
    if(!window.__printProfitReady)document.dispatchEvent(new Event('DOMContentLoaded',{bubbles:true}));
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    document.title=parsed.title||document.title;
  }
  function loadResetFix(){return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='./reset-fix.js?v=7';script.onload=resolve;script.onerror=()=>reject(new Error('Could not load PrintProfit reset fixes.'));document.body.appendChild(script);});}
  function loadEnhancements(){return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='./app-enhancements.js?v=5';script.onload=resolve;script.onerror=()=>reject(new Error('Could not load PrintProfit interface enhancements.'));document.body.appendChild(script);});}
  function loadTabLayout(){return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='./tab-layout.js?v=6';script.onload=resolve;script.onerror=()=>reject(new Error('Could not load PrintProfit tabbed workspace.'));document.body.appendChild(script);});}
  loadLegacyPage().then(loadResetFix).then(loadEnhancements).then(loadTabLayout).catch(error=>{console.error(error);document.body.innerHTML='<div class="loader"><b>PrintProfit</b><span>'+error.message+'</span></div>';});
})();
</script>
</body></html>
