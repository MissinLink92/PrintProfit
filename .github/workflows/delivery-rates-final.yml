name: PrintProfit delivery rates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-delivery-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch and verify
        shell: bash
        run: |
          python3 .github/patch_delivery.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,flags=re.S|re.I)
          if len(scripts)<2: raise SystemExit('Expected calculator scripts')
          for i,s in enumerate(scripts,1): Path(f'/tmp/pp-{i}.js').write_text(s,encoding='utf-8')
          for required in ['deliveryCourier','deliveryRate','deliveryRateOut','deliveryRateNote','delivery','deliveryCharge','calc','reset']:
              if f'id="{required}"' not in t: raise SystemExit('Missing '+required)
          PY
          for f in /tmp/pp-*.js; do node --check "$f"; done
      - name: Commit and clean temp files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/patch_delivery.py .github/workflows/delivery-rates.yml .github/workflows/delivery-rates-v2.yml .github/workflows/test-run.yml test-small.txt .github/workflows/delivery-rates-final.yml 2>/dev/null || true
          git add index.html
          git commit -m "Add courier delivery rate selector [skip ci]"
          git push
