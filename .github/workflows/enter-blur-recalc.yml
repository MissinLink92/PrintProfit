name: Add blur and Enter recalculation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install test dependency
        run: npm install --no-save jsdom@26

      - name: Patch and test
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          insert="""
          <script>
          (()=>{
            const bindRecalcShortcuts=()=>{
              const runCalcButton=()=>{const b=document.getElementById('calc');if(b)b.click();};
              document.addEventListener('focusout',e=>{
                if(e.target&&e.target.matches('input:not([type=\"file\"]),select,textarea')) setTimeout(runCalcButton,0);
              });
              document.addEventListener('keydown',e=>{
                if(e.key==='Enter'&&e.target&&e.target.matches('input:not([type=\"file\"]),select,textarea')){
                  e.preventDefault();
                  e.target.blur();
                  runCalcButton();
                }
              });
            };
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bindRecalcShortcuts,{once:true});
            else bindRecalcShortcuts();
          })();
          </script>
          """
          if "bindRecalcShortcuts" not in html:
              marker='</body>'
              if marker not in html:
                  raise SystemExit('body marker not found')
              html=html.replace(marker,insert+'\n'+marker,1)
          p.write_text(html,encoding='utf-8')
          PY
          node <<'JS'
          (async()=>{
            const fs=require('fs');
            const {JSDOM}=require('jsdom');
            const html=fs.readFileSync('index.html','utf8');
            const scripts=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
            if(scripts.length<2) throw new Error('expected original script plus recalc shortcut script');
            for(const js of scripts) new Function(js);
            const dom=new JSDOM(html,{runScripts:'outside-only',pretendToBeVisual:true});
            for(const js of scripts) dom.window.eval(js);
            dom.window.document.dispatchEvent(new dom.window.Event('DOMContentLoaded'));
            const d=dom.window.document;
            const flush=()=>new Promise(r=>dom.window.setTimeout(r,10));
            const dispatchInput=(id,val)=>{const el=d.getElementById(id);el.value=val;el.dispatchEvent(new dom.window.Event('input',{bubbles:true}));};
            dispatchInput('printer','120|260|3000');
            dispatchInput('materialUsed','100');
            dispatchInput('printHours','2');
            await flush();
            const before=d.getElementById('cost').textContent;
            const labour=d.getElementById('labourRate');
            labour.value='10';
            labour.dispatchEvent(new dom.window.Event('focusout',{bubbles:true}));
            await flush();
            const afterBlur=d.getElementById('cost').textContent;
            if(afterBlur===before) throw new Error('blur did not recalculate');
            const power=d.getElementById('electricityRate');
            power.value='0.5';
            power.dispatchEvent(new dom.window.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
            await flush();
            const afterEnter=d.getElementById('electricityCostOut').value;
            if(afterEnter!=='£0.12') throw new Error('Enter did not recalculate: '+afterEnter);
            console.log('Blur and Enter recalculation test passed:',{before,afterBlur,afterEnter});
          })().catch(err=>{console.error(err);process.exit(1);});
          JS
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=[m.group(1) for m in re.finditer(r'<script[^>]*>([\s\S]*?)</script>',html,re.I)]
          for i,js in enumerate(scripts): Path(f'/tmp/app{i}.js').write_text(js,encoding='utf-8')
          print('script blocks:',len(scripts))
          PY
          for f in /tmp/app*.js; do node --check "$f"; done

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Recalculate on blur and Enter"
          git rm .github/workflows/enter-blur-recalc.yml
          git commit -m "Remove temporary blur recalculation workflow"
          git push origin HEAD:main
