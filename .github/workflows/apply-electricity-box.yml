name: Apply electricity calculator patch
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch site through GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'index.html';

            const current = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
            const html = Buffer.from(current.data.content, 'base64').toString('utf8');

            const start = html.indexOf('<div class="three" id="guides">');
            const end = html.indexOf('<section class="panel"><div class="head"><div class="icon">▦</div><div><h2>7. Quantity / Batch Pricing', start);
            if (start < 0 || end < 0) core.setFailed('Could not locate the Box 4-7 guide block');
            else {
              const guides = `<div class="three" id="guides"><section class="panel"><div class="head"><div class="icon">£</div><div><h2>4. Additional Costs</h2><p>Optional costs per print, excluding electricity.</p></div></div><div class="two"><div><label>Labour (£/hour)</label><input id="labourRate" type="number" value="0" step=".01"></div><div><label>Packaging (£)</label><input id="pack" type="number" value="0" step=".01"></div><div><label>Other (£)</label><input id="other" type="number" value="0" step=".01"></div></div></section><section class="panel"><div class="head"><div class="icon">⚡</div><div><h2>5. Electricity</h2><p>Uses Box 2 printer power and Box 3 print time from your file.</p></div></div><div class="two"><div><label>Electricity provider / tariff</label><input id="electricityProvider" type="text" placeholder="e.g. Octopus Energy - Flexible"></div><div><label>Unit rate (£/kWh)</label><input id="electricityRate" type="number" value=".30" min="0" step=".001"></div></div><div class="two" style="margin-top:9px"><div><label>Estimated printer power</label><input id="printerPowerOut" type="text" value="—" readonly></div><div><label>Estimated power used (kWh)</label><input id="powerUsedOut" type="text" value="0.000 kWh" readonly></div></div><div class="two" style="margin-top:9px"><div><label>Estimated electricity cost</label><input id="electricityCostOut" type="text" value="£0.00" readonly></div><div class="small" style="display:flex;align-items:flex-end;padding-bottom:10px" id="electricityStatus">Select a printer and load a print file to estimate electricity usage.</div></div></section><section class="panel"><div class="head"><div class="icon">%</div><div><h2>6. Platform Fees</h2><p>Marketplace and payment fees.</p></div></div><label>Platform</label><select id="platform"><option value="0">Own website</option><option value="6.5">Etsy</option><option value="12">eBay</option><option value="0">Other / custom</option></select><div class="two" style="margin-top:9px"><div><label>Payment fee (%)</label><input id="pay" type="number" value="0" step=".01"></div><div><label>Fixed fee (£)</label><input id="fixedFee" type="number" value="0" step=".01"></div></div></section><section class="panel"><div class="head"><div class="icon">⇩</div><div><h2>7. Delivery</h2><p>Keep delivery cost and charge separate.</p></div></div><div class="two"><div><label>Cost to you (£)</label><input id="delivery" type="number" value="0" step=".01"></div><div><label>Charged to customer (£)</label><input id="deliveryCharge" type="number" value="0" step=".01"></div></div></section></div>\n`;
              let updated = html.slice(0, start) + guides + html.slice(end);
              updated = updated.replace('<h2>7. Quantity / Batch Pricing</h2>', '<h2>8. Quantity / Batch Pricing</h2>');

              const calcRe = /function calc\(\)\{[\s\S]*?\n\}\n\n\$\('calc'\)\.onclick=calc;/;
              const calc = `function calc(){
  const p=printerData(),qty=Math.max(1,Math.floor(n('qty'))),disc=Math.min(100,n('discount'))/100;
  const hours=n('printHours'),pack=n('materialPack'),packPrice=n('materialPackCost'),used=n('materialUsed');
  state.hours=hours;const materialCost=pack>0&&used>0?packPrice*(used/pack):0;
  const powerUsed=p.watts>0&&hours>0?p.watts/1000*hours:0;
  const elec=powerUsed*n('electricityRate');
  const depreciation=p.lifetime&&hours?p.price/p.lifetime*hours:0;
  const labour=n('labourRate')*hours;
  const base=materialCost+elec+depreciation+labour+n('pack')+n('other')+n('delivery');
  const sell=n('sell'),fees=sell*(n('platform')+n('pay'))/100+n('fixedFee');
  const profit=sell+n('deliveryCharge')-base-fees,margin=sell?profit/sell:0;
  $('printerPowerOut').value=p.watts>0?Math.round(p.watts)+' W':'—';
  $('powerUsedOut').value=powerUsed.toFixed(3)+' kWh';
  $('electricityCostOut').value=money(elec);
  const provider=$('electricityProvider').value.trim();
  $('electricityStatus').textContent=!p.watts?'Select a printer in Box 2 to estimate power draw.':!hours?'Load a print file or enter print time in Box 3.':!n('electricityRate')?'Enter your electricity unit rate to calculate cost.':(provider?provider+' • ':'')+'Estimated from '+Math.round(p.watts)+' W for '+hours.toFixed(2)+' h.';
  $('cost').textContent=money(base);$('sellOut').textContent=money(sell);$('profit').textContent=money(profit);$('profit').className='value '+(profit>=0?'good':'bad');$('margin').textContent='Margin: '+(margin*100).toFixed(1)+'%';$('materialCostOut').value=money(materialCost);
  $('breakdown').innerHTML=[['Material',materialCost],['Electricity',elec],['Printer depreciation',depreciation],['Labour',labour],['Packaging + other',n('pack')+n('other')],['Delivery',n('delivery')],['Platform/payment fees',fees]].map(([k,v])=>\`<div class="line"><span>\${k}</span><b>\${money(v)}</b></div>\`).join('')+\`<div class="line total"><span>Quantity \${qty} • batch total after \${disc*100}% discount</span><b>\${money((base+fees)*qty*(1-disc))}</b></div>\`;
}

$('calc').onclick=calc;`;
              if (!calcRe.test(updated)) core.setFailed('Could not locate calc function');
              else {
                updated = updated.replace(calcRe, calc);
                updated = updated.replace("['materialPack','materialPackCost','materialUsed','printHours','labourRate','kwh','pack','other','delivery','deliveryCharge','qty','discount','pay','fixedFee']", "['materialPack','materialPackCost','materialUsed','printHours','labourRate','pack','other','electricityRate','electricityProvider','delivery','deliveryCharge','qty','discount','pay','fixedFee']");

                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path,
                  message: 'Split electricity into dedicated calculator',
                  content: Buffer.from(updated, 'utf8').toString('base64'),
                  sha: current.data.sha,
                  branch: 'main'
                });
                core.info('index.html updated');

                const wfPath = '.github/workflows/apply-electricity-box.yml';
                const wf = await github.rest.repos.getContent({owner, repo, path: wfPath, ref: 'main'});
                await github.rest.repos.deleteFile({
                  owner, repo, path: wfPath,
                  message: 'Remove temporary electricity patch workflow',
                  sha: wf.data.sha,
                  branch: 'main'
                });
                core.info('Temporary workflow removed');
              }
            }
