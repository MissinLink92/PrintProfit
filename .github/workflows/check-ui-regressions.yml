name: Check language and Workshop regressions

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - 'locales/**'
      - 'scripts/check_*.cjs'
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.billing.json'
      - '.github/workflows/check-ui-regressions.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check product categories
        run: node scripts/check_product_categories.cjs
      - name: Check business exports and material barcodes
        run: node scripts/check_business_tools.cjs
      - name: Check uploaded material usage
        run: node scripts/check_file_usage.cjs
      - name: Check print-farm production runs
        run: node scripts/check_print_farm.cjs
      - name: Check labour hours and minutes
        run: node scripts/check_labour_time.cjs
      - name: Check calculator arithmetic
        run: node scripts/check_calculator_math.cjs
      - name: Check translation initialization and switching
        run: node scripts/check_i18n.cjs
      - name: Check currency labels and calculated values
        run: node scripts/check_currency_labels.cjs
      - name: Check verified material market references
        run: node scripts/check_market_prices.cjs
      - name: Check saved printer options and metadata
        run: node scripts/check_workshop_printers.cjs
      - name: Check Workspace popup placement and scroll restoration
        run: node scripts/check_workspace_modals.cjs
      - name: Check shared Guide and Settings panels
        run: node scripts/check_shared_panels.cjs
      - name: Check Pro Workspace routing
        run: node scripts/check_pro_workspace.cjs
      - name: Check shared site icons
        run: node scripts/check_site_icons.cjs

      - name: Test billing backend and Firestore rule contract
        run: node --test functions/billing-core.test.js functions/billing-handlers.test.js
      - name: Check Free backups and cloud access gating
        run: node scripts/check_free_pro.cjs

