name: Expand PrintProfit printer profiles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand printer selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          select='''<select id="printerProfile">
          <option value="">Select a printer...</option>
          <optgroup label="Bambu Lab"><option value="120|260|3000">A1 mini</option><option value="130|320|3000">A1</option><option value="180|550|4000">P1P</option><option value="180|700|4000">P1S</option><option value="200|1000|4500">X1 Carbon</option><option value="250|700|4500">X2D</option><option value="300|1100|5000">H2S</option></optgroup>
          <optgroup label="Creality"><option value="100|180|2500">Ender-3 V3 SE</option><option value="110|250|2500">Ender-3 V3 KE</option><option value="200|450|3500">K1C</option><option value="230|650|4000">K1 Max</option><option value="350|900|5000">K2 Plus</option></optgroup>
          <optgroup label="Elegoo"><option value="150|220|3000">Neptune 4</option><option value="160|250|3200">Neptune 4 Pro</option><option value="200|320|3500">Neptune 4 Plus</option><option value="250|450|3500">Neptune 4 Max</option><option value="200|400|4000">Centauri Carbon</option></optgroup>
          <optgroup label="Prusa Research"><option value="120|450|3500">MINI+</option><option value="140|700|4500">MK4S</option><option value="200|1000|5000">CORE One</option><option value="250|2000|6000">XL</option></optgroup>
          <optgroup label="Anycubic"><option value="120|180|2500">Kobra 2 Neo</option><option value="160|350|3500">Kobra 3</option><option value="180|500|3500">Kobra 3 Combo</option><option value="200|600|4000">Kobra S1</option></optgroup>
          <optgroup label="Sovol"><option value="160|250|3000">SV06</option><option value="170|300|3000">SV07</option><option value="250|550|4000">SV08</option><option value="350|800|4500">SV08 Max</option></optgroup>
          <optgroup label="QIDI Tech"><option value="250|650|4000">X-Plus 3</option><option value="300|800|4500">X-Max 3</option><option value="250|500|4000">Q1 Pro</option><option value="300|700|4500">Plus4</option></optgroup>
          <optgroup label="FlashForge"><option value="180|350|3500">Adventurer 5M</option><option value="220|500|4000">Adventurer 5M Pro</option><option value="220|550|4000">AD5X</option><option value="300|800|4500">Guider 3 Ultra</option></optgroup>
          <optgroup label="Snapmaker"><option value="250|800|4500">J1S</option><option value="350|2500|5000">Artisan</option><option value="250|700|4000">U1</option></optgroup>
          <optgroup label="Raise3D"><option value="400|3000|6000">E2</option><option value="500|5000|7000">Pro3</option><option value="550|6500|7000">Pro3 Plus</option></optgroup>
          <optgroup label="Ultimaker"><option value="180|1200|5000">Ultimaker 2+</option><option value="250|3500|6000">S3</option><option value="500|6000|7000">S5</option><option value="500|7500|7000">S7</option></optgroup>
          <optgroup label="Voron (DIY)"><option value="150|400|3000">Voron 0.2</option><option value="250|700|4000">Voron Trident</option><option value="300|1200|5000">Voron 2.4</option></optgroup>
          <optgroup label="AnkerMake"><option value="200|500|3500">M5</option><option value="180|400|3000">M5C</option></optgroup>
          <optgroup label="Artillery"><option value="200|350|3500">Sidewinder X3 Plus</option><option value="250|500|4000">Sidewinder X4 Pro</option></optgroup>
          <option value="custom">Custom printer</option>
          </select>'''
          s,n=re.subn(r'<select id="printerProfile">.*?</select>',select,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Printer selector not found')
          s=s.replace('<p>Select your printer or add a custom profile.</p>','<p>Choose a starter profile or add your own printer.</p>',1)
          s=s.replace('Choose the printer you use. The profile is only a starting point; the power and lifetime values below can be adjusted.','Choose the printer you use. These are starter profiles; power, purchase price and lifetime can be adjusted later to match your real machine.',1)
          old=r"\$\('printerProfile'\)\.addEventListener\('change',\(\)=>\{.*?\}\);"
          new='''const printerProfile=$('printerProfile');
          printerProfile.addEventListener('change',()=>{
            const v=printerProfile.value;
            if(/^\\d+\\|/.test(v)){const [watts,price,life]=v.split('|').map(Number);$('watts').value=watts;$('printerPrice').value=price;$('life').value=life;}
          });
          $('addPrinter').addEventListener('click',()=>{
            const name=prompt('Printer name (e.g. My Neptune 4 Mod)');
            if(!name)return;
            const watts=Math.max(1,parseFloat(prompt('Typical power draw in watts','150'))||150);
            const price=Math.max(0,parseFloat(prompt('Printer purchase price (£)','300'))||0);
            const life=Math.max(1,parseFloat(prompt('Expected printer lifetime (print hours)','3000'))||3000);
            const opt=document.createElement('option');opt.value=`${watts}|${price}|${life}`;opt.textContent=`${name} (custom)`;printerProfile.appendChild(opt);printerProfile.value=opt.value;printerProfile.dispatchEvent(new Event('change'));
          });'''
          s,n=re.subn(old,new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Printer change handler not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/expand-printers.yml
          git add index.html
          git commit -m "Expand printer profiles"
          git push
