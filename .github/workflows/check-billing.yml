name: Check subscription foundation
on:
  push:
    branches: [main]
    paths: ['functions/**', 'admin/**', 'firebase.billing.json', 'pro-subscription.js', 'workshop-account-sync.js', 'my-materials.js', 'material-scanner.js', 'print-farm.js', 'business-tools.js', 'index.html', 'config/billing-config.js', '.github/workflows/check-billing.yml']
  pull_request:
    paths: ['functions/**', 'admin/**', 'firebase.billing.json', 'pro-subscription.js', 'workshop-account-sync.js', 'my-materials.js', 'material-scanner.js', 'print-farm.js', 'business-tools.js', 'index.html', 'config/billing-config.js', '.github/workflows/check-billing.yml']
permissions:
  contents: read
jobs:
  billing-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend syntax and subscription policy
        run: |
          node --check functions/index.js
          node --check pro-subscription.js
          node --check workshop-account-sync.js
          node --check my-materials.js
          node --check material-scanner.js
          node --check print-farm.js
          node --check business-tools.js
          node scripts/check_pro_workspace.cjs
          node --check admin/admin.js
          node --test functions/*.test.js
