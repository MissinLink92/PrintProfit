name: Check subscription foundation
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firebase.billing.json', 'pro-subscription.js', 'workshop-account-sync.js', 'config/billing-config.js', '.github/workflows/check-billing.yml']
  pull_request:
    paths: ['functions/**', 'firebase.billing.json', 'pro-subscription.js', 'workshop-account-sync.js', 'config/billing-config.js', '.github/workflows/check-billing.yml']
permissions:
  contents: read
jobs:
  billing-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend syntax and subscription policy
        run: |
          node --check functions/index.js
          node --check pro-subscription.js
          node --check workshop-account-sync.js
          node --test functions/billing-core.test.js functions/billing-handlers.test.js
