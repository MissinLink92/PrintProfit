name: PrintProfit delivery rates V1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-delivery-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch delivery controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          marker='/* PrintProfit delivery rates V1 */'
          if marker in t: raise SystemExit('Already patched')
          old='<div class="merge-block"><div class="head"><div class="icon">⇩</div><div><h2>Delivery</h2><p>Keep delivery cost and charge separate.</p></div></div><div class="two"><div><label>Cost to you (£)</label><input id="delivery" type="number" value="0" step=".01"></div><div><label>Charged to customer (£)</label><input id="deliveryCharge" type="number" value="0" step=".01"></div></div></div>'
          new='''<div class="merge-block"><div class="head"><div class="icon">⇩</div><div><h2>Delivery</h2><p>Choose a courier/service rate, then override it when needed.</p></div></div><div class="delivery-tools"><div class="two"><div><label>Courier / delivery firm</label><select id="deliveryCourier"><option value="royalmail">Royal Mail</option><option value="evri">Evri</option><option value="inpost">InPost</option><option value="dpd">DPD Online</option><option value="dhl">DHL eCommerce UK</option><option value="parcelforce">Parcelforce</option><option value="ups">UPS</option><option value="fedex">FedEx</option><option value="custom">Custom / Other</option></select></div><div><label>Service / rate</label><select id="deliveryRate"></select></div></div><div class="two delivery-rate-row"><div><label>Automatic rate</label><input id="deliveryRateOut" type="text" value="£0.00" readonly></div><div class="small" id="deliveryRateNote">Select a courier and rate.</div></div><div class="small delivery-note">Published UK reference rates. Final quotes can vary by dimensions, destination, account type, surcharges and promotions.</div></div><div class="two"><div><label>Cost to you (£)</label><input id="delivery" type="number" value="0" step=".01"></div><div><label>Charged to customer (£)</label><input id="deliveryCharge" type="number" value="0" step=".01"></div></div></div>'''
          if old not in t: raise SystemExit('Delivery block not found')
          t=t.replace(old,new,1)
          css='''\n/* PrintProfit delivery rates V1 */\n.delivery-tools{margin-bottom:10px}.delivery-note{margin-top:7px;line-height:1.35}.delivery-rate-row{margin-top:7px}.delivery-rate-row .small{align-self:end;padding-bottom:7px}#deliveryRateOut{font-weight:700;color:var(--accent)}\n'''
          t=t.replace('</style>',css+'</style>',1)
          js=r'''\n\n  const deliveryProfiles={royalmail:{source:'Royal Mail online prices effective 7 April 2026',rates:[{label:'Tracked 48 — Large Letter — up to 1kg — £2.85',price:2.85,note:'Online; max 35.3 × 25 × 2.5cm.'},{label:'Tracked 48 — Small Parcel — up to 2kg — £3.65',price:3.65,note:'Online; max 45 × 35 × 16cm.'},{label:'Tracked 48 — Medium Parcel — up to 2kg — £5.55',price:5.55,note:'Online; max 61 × 46 × 46cm.'},{label:'Tracked 48 — Medium Parcel — up to 10kg — £7.35',price:7.35,note:'Online.'},{label:'Tracked 48 — Medium Parcel — up to 20kg — £11.85',price:11.85,note:'Online.'},{label:'Tracked 24 — Large Letter — up to 1kg — £3.80',price:3.80,note:'Online starting price.'},{label:'Tracked 24 — Small Parcel — up to 2kg — £4.65',price:4.65,note:'Online.'},{label:'Tracked 24 — Medium Parcel — up to 20kg — £6.55',price:6.55,note:'Online starting price.'}]},evri:{source:'Evri online prices shown September 2026',rates:[{label:'Standard — Postable under 1kg — £2.70',price:2.70,note:'Home/work; up to 23 × 35 × 3cm.'},{label:'Standard — Small 0–1kg — £3.04',price:3.04,note:'Home/work.'},{label:'Standard — Standard 0–1kg — £3.29',price:3.29,note:'Home/work.'},{label:'Standard — Small 1–2kg — £3.52',price:3.52,note:'Home/work.'},{label:'Standard — 1–2kg — £4.79',price:4.79,note:'Home/work.'},{label:'Standard — 2–5kg — £6.59',price:6.59,note:'Home/work.'},{label:'Standard — 5–10kg — £6.68',price:6.68,note:'Home/work.'},{label:'Standard — 10–15kg — £10.28',price:10.28,note:'Home/work.'},{label:'Next Day — Small 0–1kg — £3.90',price:3.90,note:'Home/work; availability varies.'},{label:'Next Day — Small 1–2kg — £4.60',price:4.60,note:'Home/work; availability varies.'}]},inpost:{source:'InPost parcel price list',rates:[{label:'Locker / Shop — Small — £1.99',price:1.99,note:'Up to 15kg.'},{label:'Locker / Shop — Medium — £2.59',price:2.59,note:'Up to 15kg.'},{label:'Locker / Shop — Large — £3.99',price:3.99,note:'Up to 15kg.'},{label:'Home address — Small — £2.89',price:2.89,note:'Up to 15kg.'},{label:'Home address — Medium — £3.99',price:3.99,note:'Up to 15kg.'},{label:'Home address — Large — £5.99',price:5.99,note:'Up to 15kg.'}]},dpd:{source:'DPD Online published UK starting prices',rates:[{label:'UK drop-off — from £2.99',price:2.99,note:'Starting price; exact quote depends on parcel details.'},{label:'UK collection — from £5.81',price:5.81,note:'Starting price; exact quote varies by size/weight.'}]},dhl:{source:'DHL eCommerce UK published price',rates:[{label:'UK delivery — from £2.79',price:2.79,note:'Includes VAT; quote depends on parcel details.'}]},parcelforce:{source:'Parcelforce UK retail prices valid 7 April 2026',rates:[{label:'express48 — from £11.95',price:11.95,note:'Up to 30kg; tracked.'},{label:'express24 — from £12.50',price:12.50,note:'Up to 30kg; tracked.'},{label:'expressAM — from £16.50',price:16.50,note:'Up to 30kg.'},{label:'express10 — from £28.10',price:28.10,note:'Up to 30kg.'},{label:'express48large — from £51.65',price:51.65,note:'Large parcel service.'}]},ups:{source:'UPS UK public rate guidance',rates:[{label:'Domestic UK — quote required',price:0,note:'Enter your quoted rate below.'}]},fedex:{source:'FedEx UK rates effective 5 January 2026',rates:[{label:'Domestic UK — quote required',price:0,note:'Enter your quoted rate below.'}]},custom:{source:'Manual entry',rates:[{label:'Manual rate — enter below',price:0,note:'Use your own business or negotiated rate.'}]}};
  function updateDeliveryRates(){const c=$('deliveryCourier'),r=$('deliveryRate');if(!c||!r)return;const p=deliveryProfiles[c.value]||deliveryProfiles.custom;r.innerHTML=p.rates.map((x,i)=>'<option value="'+i+'">'+x.label+'</option>').join('');updateDeliveryRate(true);}
  function updateDeliveryRate(autoApply=true){const c=$('deliveryCourier'),r=$('deliveryRate');if(!c||!r)return;const p=deliveryProfiles[c.value]||deliveryProfiles.custom;const item=p.rates[Number(r.value)]||p.rates[0];setValue('deliveryRateOut',money(item.price));setText('deliveryRateNote',p.source+' • '+item.note);if(autoApply&&item.price>0)setValue('delivery',item.price);calc();}
'''
          a='  function setText(id,text){const el=$(id);if(el)el.textContent=text;}'
          if a not in t: raise SystemExit('JS anchor missing')
          t=t.replace(a,js+'\n'+a,1)
          b="    const clear=$('clear');"
          if b not in t: raise SystemExit('bind anchor missing')
          t=t.replace(b,"    const deliveryCourier=$('deliveryCourier');\n    if(deliveryCourier)deliveryCourier.addEventListener('change',updateDeliveryRates);\n    const deliveryRate=$('deliveryRate');\n    if(deliveryRate)deliveryRate.addEventListener('change',()=>updateDeliveryRate(true));\n\n"+b,1)
          i="    try{applyPlatformProfile();}catch(err){console.error('Platform profile error:',err);runCalc();}"
          if i not in t: raise SystemExit('init anchor missing')
          t=t.replace(i,i+"\n    try{updateDeliveryRates();}catch(err){console.error('Delivery rate error:',err);runCalc();}",1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          for i in ['deliveryCourier','deliveryRate','deliveryRateOut','delivery','deliveryCharge','calc','reset']:
            if f'id="{i}"' not in t: raise SystemExit('missing '+i)
          ss=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,flags=re.S|re.I)
          for i,s in enumerate(ss,1): Path(f'/tmp/pp-{i}.js').write_text(s,encoding='utf-8')
          PY
          for f in /tmp/pp-*.js; do node --check "$f"; done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add courier delivery rate selector [skip ci]"
          git push
