name: Nightly site audit

on:
  push:
    branches: [main]
    paths: ['print-farm*.js', 'scripts/check_print_farm.cjs']
  schedule:
    - cron: '15 1 * * *'
      timezone: Europe/London
  workflow_dispatch:
  workflow_run:
    workflows: ["PrintProfit midnight UK update"]
    types: [completed]
  pull_request:
    paths: ['scripts/audit_site.cjs', '.github/workflows/nightly-site-audit.yml']

permissions:
  contents: read

concurrency:
  group: printprofit-site-audit-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser audit tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request'
        with:
          python-version: '3.12'
      - name: Serve proposed website for pull request checks
        if: github.event_name == 'pull_request'
        run: python -m http.server 8766 --bind 127.0.0.1 &
      - name: Check calculations and feature integrations
        run: |
          node scripts/check_business_tools.cjs
          node scripts/check_print_farm.cjs
          node scripts/check_calculator_math.cjs
          node scripts/check_currency_labels.cjs
          node scripts/check_i18n.cjs
          node scripts/check_market_prices.cjs
          node scripts/check_workshop_printers.cjs
          node scripts/check_workspace_modals.cjs
      - name: Check source health and approved coupons
        run: python scripts/check_data_health.py
      - name: Check site on desktop and phone sizes
        run: node scripts/audit_site.cjs
        env:
          PP_AUDIT_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8766/' || 'https://printprofit.co.uk/' }}
      - name: Save audit and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printprofit-site-audit-${{ github.run_id }}
          path: |
            .audit-output/
            reports/data-health.json
            reports/data-health.md
          include-hidden-files: true
          retention-days: 30
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f .audit-output/audit.md ]; then
            cat .audit-output/audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
