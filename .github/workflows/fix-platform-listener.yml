name: Fix platform listener

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-platform-listener.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_platform_listener.py
      - run: |
          grep -q "electricityProvider','platform','pay'" index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable live platform fee recalculation'
          git push
