name: Check retailer feed repairs

on:
  pull_request:
    paths: ['scripts/nightly_*.py', 'scripts/check_retailer_feeds.py', 'scripts/check_source_reliability.py', 'config/reference-verifications.json', 'config/nightly-sources.json', '.github/workflows/check-retailer-feeds.yml']
  push:
    branches: [main]
    paths: ['scripts/nightly_*.py', 'scripts/check_retailer_feeds.py', 'scripts/check_source_reliability.py', 'config/reference-verifications.json', 'config/nightly-sources.json', '.github/workflows/check-retailer-feeds.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-nightly.txt
      - run: python scripts/check_retailer_feeds.py
      - run: python scripts/check_source_reliability.py
