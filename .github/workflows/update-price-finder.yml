name: PrintProfit midnight UK update

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: Europe/London
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'data/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'assets/**'
      - '.github/workflows/update-price-finder.yml'

concurrency:
  group: printprofit-refresh-and-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-nightly.txt
      - name: Install updater dependencies
        run: python -m pip install -r scripts/requirements-nightly.txt
      - name: Refresh UK reference prices, product prices and photos
        run: python scripts/nightly_update.py
      - name: Keep update report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printprofit-nightly-report-${{ github.run_id }}
          path: |
            reports/
            data/nightly-report.json
            data/review-queue.json
            config/review-decisions.json
          retention-days: 30
          if-no-files-found: warn
      - name: Publish run summary
        if: always()
        run: |
          if [ -f reports/nightly-report.md ]; then
            cat reports/nightly-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price-finder.json data/price-finder.js data/reference-data.json data/reference-data.js
          git add data/review-queue.json data/nightly-report.json printer-price-data.js assets/products config/nightly-sources.json reports
          if ! git diff --cached --quiet; then
            git commit -m "Refresh PrintProfit UK prices and review queue"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the public website
        run: python scripts/build_pages.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy refreshed website
        id: deployment
        uses: actions/deploy-pages@v4
