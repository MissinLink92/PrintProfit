name: Update Price Finder

on:
  schedule:
    # Refresh market data every 12 hours.
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PrintProfit
        uses: actions/checkout@v4

      - name: Update Price Finder and market data
        shell: bash
        run: python3 scripts/update-price-finder.py

      - name: Commit refreshed data
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Price Finder changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price-finder.json data/price-finder.js printer-price-data.js
          git commit -m "chore: refresh Price Finder data"
          git push
