name: PrintProfit quick price UX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch quick price controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          marker = '/* PrintProfit quick price UX V1 */'
          if marker in t:
              raise SystemExit('Patch already present')

          old_single = '''<div class="quick">\n      <div class="small">Quick Price Buttons (target margin)</div>\n      <div class="grid">\n        <button type="button" class="btn" data-m=".3" data-target-view="single">+ 30%</button>\n        <button type="button" class="btn" data-m=".5" data-target-view="single">+ 50%</button>\n        <button type="button" class="btn" data-m=".6" data-target-view="single">+ 60%</button>\n      </div>\n    </div>'''
          new_single = '''<div class="quick">\n      <div class="small">Quick Price Buttons (target margin)</div>\n      <div class="grid">\n        <button type="button" class="btn" data-m=".3" data-target-view="single">+ 30%</button>\n        <button type="button" class="btn" data-m=".5" data-target-view="single">+ 50%</button>\n        <button type="button" class="btn" data-m=".6" data-target-view="single">+ 60%</button>\n      </div>\n      <div class="custom-target">\n        <label for="singleCustomMargin">Custom target margin (%)</label>\n        <input id="singleCustomMargin" type="number" min="0" max="99.9" step=".1" placeholder="e.g. 42.5">\n        <div class="small custom-target-note">Click an active quick button again to undo it and restore your previous selling price.</div>\n      </div>\n    </div>'''
          if old_single not in t:
              raise SystemExit('Single quick price block not found')
          t = t.replace(old_single, new_single, 1)

          old_batch = '''<div class="quick">\n      <div class="small">Quick Batch Price (target margin)</div>\n      <div class="grid">\n        <button type="button" class="btn" data-m=".3" data-target-view="batch">+ 30%</button>\n        <button type="button" class="btn" data-m=".5" data-target-view="batch">+ 50%</button>\n        <button type="button" class="btn" data-m=".6" data-target-view="batch">+ 60%</button>\n      </div>\n    </div>'''
          new_batch = '''<div class="quick">\n      <div class="small">Quick Batch Price (target margin)</div>\n      <div class="grid">\n        <button type="button" class="btn" data-m=".3" data-target-view="batch">+ 30%</button>\n        <button type="button" class="btn" data-m=".5" data-target-view="batch">+ 50%</button>\n        <button type="button" class="btn" data-m=".6" data-target-view="batch">+ 60%</button>\n      </div>\n      <div class="custom-target">\n        <label for="batchCustomMargin">Custom target margin (%)</label>\n        <input id="batchCustomMargin" type="number" min="0" max="99.9" step=".1" placeholder="e.g. 42.5">\n        <div class="small custom-target-note">Enter your own target margin; leave blank to return to your manual selling price.</div>\n      </div>\n    </div>'''
          if old_batch not in t:
              raise SystemExit('Batch quick price block not found')
          t = t.replace(old_batch, new_batch, 1)

          css = '''\n/* PrintProfit quick price UX V1 */\n.custom-target{margin-top:8px}.custom-target label{margin-bottom:4px}.custom-target input{margin-top:1px}.custom-target-note{margin-top:5px;line-height:1.35}.quick .btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}\n'''
          pos = t.find('</style>')
          if pos < 0:
              raise SystemExit('Closing style tag not found')
          t = t[:pos] + css + t[pos:]

          old_state = "const state={hours:0,used:0,unit:'g',file:'',resultMode:'single'};"
          new_state = "const state={hours:0,used:0,unit:'g',file:'',resultMode:'single',manualSell:0,quickTarget:{single:null,batch:null}};"
          if old_state not in t:
              raise SystemExit('State declaration not found')
          t = t.replace(old_state, new_state, 1)

          old_bind = '''    document.querySelectorAll('[data-m][data-target-view]').forEach(button=>button.addEventListener('click',()=>{\n      const price=targetPrice(parseFloat(button.dataset.m),button.dataset.targetView);\n      if(price!==null){setValue('sell',price.toFixed(2));runCalc();setResultTab(button.dataset.targetView);}\n    }));'''
          new_bind = '''    state.manualSell=n('sell');\n\n    document.querySelectorAll('[data-m][data-target-view]').forEach(button=>button.addEventListener('click',()=>{\n      const mode=button.dataset.targetView;\n      const target=parseFloat(button.dataset.m);\n      const isActive=state.quickTarget[mode]!==null && Math.abs(state.quickTarget[mode]-target)<0.000001;\n      if(isActive){\n        setValue('sell',state.manualSell.toFixed(2));\n        state.quickTarget[mode]=null;\n        document.querySelectorAll('[data-target-view="'+mode+'"][data-m]').forEach(b=>b.classList.remove('active'));\n      }else{\n        const price=targetPrice(target,mode);\n        if(price!==null){\n          setValue('sell',price.toFixed(2));\n          state.quickTarget[mode]=target;\n          document.querySelectorAll('[data-target-view="'+mode+'"][data-m]').forEach(b=>b.classList.toggle('active',b===button));\n          const custom=$(mode==='single'?'singleCustomMargin':'batchCustomMargin');\n          if(custom)custom.value='';\n        }\n      }\n      runCalc();\n      setResultTab(mode);\n    }));\n\n    ['singleCustomMargin','batchCustomMargin'].forEach(id=>{\n      const input=$(id);\n      if(!input)return;\n      input.addEventListener('input',()=>{\n        const mode=id==='singleCustomMargin'?'single':'batch';\n        const raw=input.value.trim();\n        document.querySelectorAll('[data-target-view="'+mode+'"][data-m]').forEach(b=>b.classList.remove('active'));\n        state.quickTarget[mode]=null;\n        if(raw===''){\n          setValue('sell',state.manualSell.toFixed(2));\n          runCalc();\n          return;\n        }\n        const percent=parseFloat(raw);\n        if(Number.isFinite(percent)&&percent>=0&&percent<100){\n          const price=targetPrice(percent/100,mode);\n          if(price!==null){setValue('sell',price.toFixed(2));runCalc();setResultTab(mode);return;}\n        }\n        runCalc();\n      });\n      input.addEventListener('focusout',()=>{\n        const raw=input.value.trim();\n        if(raw==='')return;\n        const percent=parseFloat(raw);\n        if(!(Number.isFinite(percent)&&percent>=0&&percent<100))input.value='';\n      });\n    });\n\n    const sellInput=$('sell');\n    if(sellInput){\n      sellInput.addEventListener('focusin',()=>{\n        state.manualSell=n('sell');\n        state.quickTarget.single=null;\n        state.quickTarget.batch=null;\n        document.querySelectorAll('[data-m][data-target-view]').forEach(b=>b.classList.remove('active'));\n        const a=$('singleCustomMargin'),b=$('batchCustomMargin');\n        if(a)a.value='';\n        if(b)b.value='';\n      });\n    }'''
          if old_bind not in t:
              raise SystemExit('Quick price binding block not found')
          t = t.replace(old_bind, new_bind, 1)

          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', t, flags=re.S | re.I)
          if len(scripts)<2:
              raise SystemExit('Expected calculator JavaScript blocks')
          for i,s in enumerate(scripts,1):
              Path(f'/tmp/printprofit-quick-{i}.js').write_text(s,encoding='utf-8')

          p.write_text(t,encoding='utf-8')
          print('Quick price controls patched')
          PY

          for f in /tmp/printprofit-quick-*.js; do node --check "$f"; done

      - name: Verify quick price UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          required=['singleCustomMargin','batchCustomMargin','quickTarget','manualSell','.quick .btn.active','data-target-view="single"','data-target-view="batch"']
          for item in required:
              if item not in t:
                  raise SystemExit('Missing quick price feature: '+item)
          if 'state.manualSell=n(\'sell\');' not in t:
              raise SystemExit('Manual selling price baseline missing')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',t,flags=re.S|re.I)
          for i,s in enumerate(scripts,1):
              Path(f'/tmp/check-quick-{i}.js').write_text(s,encoding='utf-8')
          PY
          for f in /tmp/check-quick-*.js; do node --check "$f"; done

      - name: Commit update and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make quick pricing reversible and add custom margin [skip ci]"
          git push
          git rm .github/workflows/quick-price-ux.yml
          git commit -m "Remove temporary quick price workflow [skip ci]"
          git push
