name: Merge calculator boxes visually

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  visual-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and verify visual-only change
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          original = html

          def scripts(text):
              return [m.group(1) for m in re.finditer(r'<script[^>]*>(.*?)</script>', text, re.S | re.I)]

          def ids(text):
              return sorted(set(re.findall(r'id="([^"]+)"', text)))

          original_scripts = scripts(original)
          original_ids = ids(original)

          css_marker = '.footer{display:flex;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}'
          css_insert = '.merged-group{padding:14px}.merged-group>.head{margin-bottom:14px}.merged-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.merge-block{min-width:0}.merge-block+.merge-block{border-left:1px solid var(--line);padding-left:14px}.merge-block .head{margin-bottom:10px}.merge-block .head .icon{width:30px;height:30px;font-size:13px}@media(max-width:950px){.merged-grid{grid-template-columns:1fr}.merge-block+.merge-block{border-left:0;border-top:1px solid var(--line);padding-left:0;padding-top:14px;margin-top:14px}}'
          if 'merged-group{padding:14px}' not in html:
              if css_marker not in html:
                  raise SystemExit('CSS insertion marker not found')
              html = html.replace(css_marker, css_marker + css_insert, 1)

          guides_start_marker = '<div class="three" id="guides">'
          box8_start = '<section class="panel"><div class="head"><div class="icon">▦</div><div><h2>8. Quantity / Batch Pricing</h2>'
          start = html.find(guides_start_marker)
          if start < 0:
              raise SystemExit('Box 4-7 guide container not found')
          end = html.find(box8_start, start)
          if end < 0:
              raise SystemExit('Box 8 start marker not found')
          guides_end = end
          guides_inner_start = start + len(guides_start_marker)
          guides_inner = html[guides_inner_start:guides_end]

          section_matches = list(re.finditer(r'<section class="panel">(.*?)</section>', guides_inner, re.S))
          if len(section_matches) != 4:
              raise SystemExit(f'Expected 4 guide sections, found {len(section_matches)}')
          bodies = [m.group(1) for m in section_matches]

          expected = ['4. Additional Costs','5. Electricity','6. Platform Fees','7. Delivery']
          for title in expected:
              if title not in guides_inner:
                  raise SystemExit(f'Missing expected section: {title}')

          rename_pairs = [
              ('4. Additional Costs','Additional Costs'),
              ('5. Electricity','Electricity'),
              ('6. Platform Fees','Platform Fees'),
              ('7. Delivery','Delivery'),
          ]
          renamed = []
          for body, (old, new) in zip(bodies, rename_pairs):
              if old not in body:
                  raise SystemExit(f'Missing title: {old}')
              renamed.append(body.replace(old, new, 1))
          b4, b5, b6, b7 = renamed

          merged4 = f'<section class="panel merged-group"><div class="head"><div class="icon">£</div><div><h2>4. Operating Costs</h2><p>Labour, materials, packaging and electricity used to make each print.</p></div></div><div class="merged-grid"><div class="merge-block">{b4}</div><div class="merge-block">{b5}</div></div></section>'
          merged5 = f'<section class="panel merged-group"><div class="head"><div class="icon">⇩</div><div><h2>5. Selling &amp; Fulfilment</h2><p>Marketplace fees, payment costs and delivery charges.</p></div></div><div class="merged-grid"><div class="merge-block">{b6}</div><div class="merge-block">{b7}</div></div></section>'

          replacement = '<div class="two" id="guides">' + merged4 + merged5 + '</div>\n' + box8_start.replace('8. Quantity / Batch Pricing','6. Quantity / Batch Pricing')
          html = html[:start] + replacement + html[end + len(box8_start):]

          if scripts(html) != original_scripts:
              raise SystemExit('JavaScript changed during visual-only patch')
          if ids(html) != original_ids:
              raise SystemExit('Element IDs changed during visual-only patch')

          for marker in [
              '4. Operating Costs','5. Selling &amp; Fulfilment','6. Quantity / Batch Pricing',
              'Additional Costs','Electricity','Platform Fees','Delivery',
              'id="materialUsed"','id="printHours"','id="labourRate"','id="electricityRate"',
              'id="platformSelect"','id="platform"','id="pay"','id="fixedFee"',
              'id="delivery"','id="deliveryCharge"','id="qty"','id="discount"','id="sell"'
          ]:
              if marker not in html:
                  raise SystemExit(f'Missing required marker after patch: {marker}')

          if html.count('class="merged-group"') != 2:
              raise SystemExit('Expected exactly two merged groups')
          if html.count('id="guides"') != 1:
              raise SystemExit('Expected exactly one guides container')

          p.write_text(html, encoding='utf-8')
          print('Visual-only merge verification passed')
          print('JavaScript blocks preserved:', len(original_scripts))
          print('Element IDs preserved:', len(original_ids))
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = [m.group(1) for m in re.finditer(r'<script[^>]*>(.*?)</script>', html, re.S | re.I)]
          for i, js in enumerate(scripts):
              Path(f'/tmp/printprofit-script-{i}.js').write_text(js, encoding='utf-8')
          print('script blocks:', len(scripts))
          PY
          for f in /tmp/printprofit-script-*.js; do node --check "$f"; done

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Merge calculator boxes for cleaner layout"
          git rm .github/workflows/merge-boxes-visual-only.yml
          git commit -m "Remove temporary visual merge workflow"
          git push origin HEAD:main
