name: Merge calculator boxes visually

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  visual-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and verify visual-only change
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          original = html

          def scripts(text):
              return [m.group(1) for m in re.finditer(r'<script[^>]*>([\\s\\S]*?)</script>', text, re.I)]

          def ids(text):
              return sorted(set(re.findall(r'\\bid="([^"]+)"', text)))

          original_scripts = scripts(original)
          original_ids = ids(original)

          # CSS only: styling for the two merged groups.
          css_marker = '.footer{display:flex;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}'
          css_insert = '.merged-group{padding:14px}.merged-group>.head{margin-bottom:14px}.merged-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.merge-block{min-width:0}.merge-block+.merge-block{border-left:1px solid var(--line);padding-left:14px}.merge-block .head{margin-bottom:10px}.merge-block .head .icon{width:30px;height:30px;font-size:13px}@media(max-width:950px){.merged-grid{grid-template-columns:1fr}.merge-block+.merge-block{border-left:0;border-top:1px solid var(--line);padding-left:0;padding-top:14px;margin-top:14px}}'
          if 'merged-group{padding:14px}' not in html:
              if css_marker not in html:
                  raise SystemExit('CSS insertion marker not found')
              html = html.replace(css_marker, css_marker + css_insert, 1)

          # Layout-only restructure of Boxes 4-7. Field IDs and contents are preserved.
          guides_match = re.search(r'<div class="three" id="guides">([\\s\\S]*?)</div>\\n<section class="panel"><div class="head"><div class="icon">▦</div><div><h2>8\\. Quantity / Batch Pricing</h2>', html)
          if not guides_match:
              raise SystemExit('Box 4-7 guide container not found')
          guides_inner = guides_match.group(1)

          sections = re.findall(r'<section class="panel">([\\s\\S]*?)</section>', guides_inner)
          if len(sections) != 4:
              raise SystemExit(f'Expected 4 guide sections, found {len(sections)}')

          def section_body(title_fragment):
              pat = rf'<section class="panel">([\\s\\S]*?<h2>{re.escape(title_fragment)}</h2>[\\s\\S]*?)</section>'
              m = re.search(pat, guides_inner)
              if not m:
                  raise SystemExit(f'Could not find section {title_fragment}')
              return m.group(1)

          b4 = section_body('4. Additional Costs')
          b5 = section_body('5. Electricity')
          b6 = section_body('6. Platform Fees')
          b7 = section_body('7. Delivery')

          def clean_body(body, new_title):
              body = body.replace('4. Additional Costs', new_title, 1)
              body = body.replace('5. Electricity', new_title, 1)
              body = body.replace('6. Platform Fees', new_title, 1)
              body = body.replace('7. Delivery', new_title, 1)
              return body

          b4 = clean_body(b4, 'Additional Costs')
          b5 = clean_body(b5, 'Electricity')
          b6 = clean_body(b6, 'Platform Fees')
          b7 = clean_body(b7, 'Delivery')

          merged4 = f'''<section class="panel merged-group"><div class="head"><div class="icon">£</div><div><h2>4. Operating Costs</h2><p>Labour, materials, packaging and electricity used to make each print.</p></div></div><div class="merged-grid"><div class="merge-block">{b4}</div><div class="merge-block">{b5}</div></div></section>'''
          merged5 = f'''<section class="panel merged-group"><div class="head"><div class="icon">⇩</div><div><h2>5. Selling &amp; Fulfilment</h2><p>Marketplace fees, payment costs and delivery charges.</p></div></div><div class="merged-grid"><div class="merge-block">{b6}</div><div class="merge-block">{b7}</div></div></section>'''

          new_guides = f'<div class="two" id="guides">{merged4}{merged5}</div>\\n<section class="panel"><div class="head"><div class="icon">▦</div><div><h2>6. Quantity / Batch Pricing</h2>'
          html = html[:guides_match.start()] + new_guides + html[guides_match.end():]

          # Verify scripts and element IDs are identical: this is presentation-only.
          if scripts(html) != original_scripts:
              raise SystemExit('JavaScript changed during visual-only patch')
          if ids(html) != original_ids:
              raise SystemExit('Element IDs changed during visual-only patch')

          required = [
              'id="materialUsed"','id="printHours"','id="labourRate"','id="electricityRate"',
              'id="platformSelect"','id="platform"','id="pay"','id="fixedFee"',
              'id="delivery"','id="deliveryCharge"','id="qty"','id="discount"','id="sell"',
              '4. Operating Costs','5. Selling &amp; Fulfilment','6. Quantity / Batch Pricing'
          ]
          for marker in required:
              if marker not in html:
                  raise SystemExit(f'Missing required marker after patch: {marker}')

          p.write_text(html, encoding='utf-8')
          print('Visual-only merge verification passed')
          print('JavaScript blocks:', len(original_scripts))
          print('Element IDs preserved:', len(original_ids))
          PY

          node --check <(python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = [m.group(1) for m in re.finditer(r'<script[^>]*>([\\s\\S]*?)</script>', html, re.I)]
          print('\n'.join(scripts))
          PY
          )

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Merge calculator boxes for cleaner layout"
          git rm .github/workflows/merge-boxes-visual-only.yml
          git commit -m "Remove temporary visual merge workflow"
          git push origin HEAD:main
