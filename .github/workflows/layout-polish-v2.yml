name: PrintProfit layout polish V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refine desktop placement and sizing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '/* PrintProfit layout polish V2 */'
          if marker in text:
              raise SystemExit('V2 marker already exists; refusing to patch twice.')

          required_ids = [
              'file','printer','materialType','material','materialPack','materialPackCost',
              'materialUsed','materialCostOut','printHours','labourRate','pack','other',
              'electricityProvider','electricityRate','printerPowerOut','powerUsedOut',
              'electricityCostOut','platformSelect','platform','pay','fixedFee','delivery',
              'deliveryCharge','qty','discount','sell','calc','reset','singleResultView',
              'batchResultView','singleCost','singleSellOut','singleProfit','singleBreakdown',
              'batchCost','batchSales','batchProfit','batchDiscount','batchUnit',
              'batchDelivery','batchBreakdown'
          ]
          missing = [i for i in required_ids if f'id="{i}"' not in text]
          if missing:
              raise SystemExit(f'Missing required IDs before V2 layout patch: {missing}')

          scripts_before = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          script_hash_before = hashlib.sha256('\\n'.join(scripts_before).encode('utf-8')).hexdigest()

          css = '''
          
          /* PrintProfit layout polish V2 */
          .shell{max-width:1600px}
          .main{padding:10px}
          .panel{padding:11px}
          .head{gap:8px;margin-bottom:7px}
          .icon{width:30px;height:30px;border-radius:8px;font-size:13px}
          .head h2{font-size:15px}
          .head p{font-size:10.5px}
          label{font-size:10.5px;margin-bottom:4px}
          input,select{padding:7px 8px;border-radius:7px;font-size:13px}
          .two,.three{gap:7px}
          .btn{padding:7px 9px;border-radius:7px;font-size:13px}
          .actions{gap:6px;margin-top:7px}
          .drop{padding:14px}
          .drop b{margin-bottom:5px}
          .drop small{margin-top:5px}
          .small{font-size:10.5px}
          .merged-group{padding:11px}
          .merged-group>.head{margin-bottom:8px}
          .merged-grid{gap:11px}
          .merge-block+.merge-block{padding-left:11px}
          .merge-block .head{gap:7px;margin-bottom:7px}
          .merge-block .head .icon{width:27px;height:27px;font-size:12px}
          .cards{gap:7px}
          .card{padding:8px}
          .value{font-size:19px;margin-top:3px}
          .quick{margin-top:8px}
          .quick .grid{gap:6px;margin-top:4px}
          .break{margin-top:8px;padding:8px}
          .line{padding:5px 0;font-size:10.5px}
          .total{font-size:12.5px}

          @media(min-width:1101px){
            .layout{
              grid-template-columns:repeat(12,minmax(0,1fr));
              gap:10px;
              align-items:start;
            }
            .layout>div:first-child{display:contents}
            .layout>div:first-child>.two,
            .layout>div:first-child>#guides{display:contents}

            .layout>div:first-child>section.panel:first-child{
              grid-column:1 / span 5;
              grid-row:1;
            }
            .layout>div:first-child>.two>section.panel:first-child{
              grid-column:6 / span 4;
              grid-row:1;
            }
            .layout>div:first-child>.two>section.panel:nth-child(2){
              grid-column:1 / span 9;
              grid-row:2;
            }
            #guides>.merged-group:first-child{
              grid-column:1 / span 9;
              grid-row:3;
            }
            #guides>.merged-group:last-child{
              grid-column:1 / span 9;
              grid-row:4;
            }
            .layout>div:first-child>section.panel:last-child{
              grid-column:1 / span 9;
              grid-row:5;
            }
            .layout>.result{
              grid-column:10 / span 3;
              grid-row:1 / span 5;
            }

            .layout>div:first-child>section.panel:first-child .two{
              grid-template-columns:minmax(0,1.2fr) minmax(180px,.8fr);
            }
            .layout>div:first-child>.two>section.panel:first-child select{
              margin-top:1px;
            }
            .layout>div:first-child>.two>section.panel:nth-child(2) .two{
              gap:7px;
            }
            #guides .merged-grid{
              grid-template-columns:1.1fr .9fr;
            }
            #guides .merge-block{
              min-width:0;
            }
            .layout>div:first-child>section.panel:last-child .three{
              grid-template-columns:1fr 1fr 1.15fr;
              align-items:end;
            }
            .layout>div:first-child>section.panel:last-child .actions{
              margin-top:7px;
            }
          }

          @media(min-width:951px) and (max-width:1100px){
            .panel{padding:10px}
            .merged-group{padding:10px}
            .drop{padding:13px}
          }

          @media(max-width:650px){
            .shell{margin:0 auto 12px}
            .main{padding:8px}
            .panel{padding:9px}
            .merged-group{padding:9px}
            .drop{padding:13px 9px}
          }
          '''

          insert_at = text.find('</style>')
          if insert_at == -1:
              raise SystemExit('Could not find closing style tag.')
          text = text[:insert_at] + css + text[insert_at:]

          scripts_after = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          script_hash_after = hashlib.sha256('\\n'.join(scripts_after).encode('utf-8')).hexdigest()
          if script_hash_before != script_hash_after:
              raise SystemExit('JavaScript content changed during layout-only patch.')

          path.write_text(text, encoding='utf-8')
          print('Layout V2 CSS inserted; JavaScript content unchanged.')
          PY

      - name: Verify JavaScript and controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No JavaScript blocks found.')
          for idx, script in enumerate(scripts, 1):
              Path(f'/tmp/printprofit-v2-{idx}.js').write_text(script, encoding='utf-8')
          required = ['printer','materialUsed','electricityRate','platformSelect','deliveryCharge','qty','singleResultView','batchResultView','calc','reset']
          missing = [i for i in required if f'id="{i}"' not in text]
          if missing:
              raise SystemExit(f'Missing required IDs after layout patch: {missing}')
          print(f'Found {len(scripts)} JavaScript blocks; all required controls remain present.')
          PY
          for f in /tmp/printprofit-v2-*.js; do node --check "$f"; done

      - name: Commit layout update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine desktop layout and sizing [skip ci]"
          git push
